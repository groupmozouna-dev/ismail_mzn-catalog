<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MOZOUNA | إدارة المنتجات</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f7f5f0;color:#101b2b;font-family:Tahoma,Arial}
header{background:#101b2b;color:white;padding:20px;text-align:center}
main{max-width:700px;margin:25px auto;padding:15px}
.card{background:white;padding:20px;border-radius:10px;margin-bottom:18px;border:1px solid #eee}
h2{font-size:19px}
input,select{width:100%;padding:13px;margin:7px 0 13px;border:1px solid #ddd;border-radius:6px;font:inherit}
button{padding:12px 16px;border:0;border-radius:6px;cursor:pointer;font:inherit}
.primary{background:#101b2b;color:white;width:100%}
.gold{background:#c5a263;color:#101b2b}
.danger{background:#b52b2b;color:white}
.secondary{background:#eee;color:#101b2b}
.hidden{display:none}
.product{display:flex;gap:12px;align-items:center;border-bottom:1px solid #eee;padding:12px 0}
.product img{width:75px;height:85px;object-fit:cover;border-radius:5px}
.product-info{flex:1;min-width:0}
.product-info strong{display:block}
.actions{display:flex;gap:6px;margin-top:8px}
.actions button{padding:7px 10px;font-size:12px}
#preview{width:120px;max-height:150px;object-fit:cover;display:none;margin:10px auto}
.note{font-size:12px;color:#777;line-height:1.8}
#message{padding:10px;line-height:1.7;font-size:13px}
</style>
</head>
<body>

<header>
  <h2>MOZOUNA GROUP</h2>
  <div>لوحة إدارة المنتجات</div>
</header>

<main>

<section class="card" id="loginBox">
  <h2>تسجيل الدخول</h2>
  <input id="email" type="email" placeholder="البريد الإلكتروني">
  <input id="password" type="password" placeholder="كلمة المرور">
  <button class="primary" id="loginBtn">دخول إلى الإدارة</button>
  <div id="loginMessage" class="note"></div>
</section>

<section id="adminBox" class="hidden">

  <div class="card">
    <button class="secondary" id="logoutBtn">تسجيل الخروج</button>
    <h2 id="formTitle">إضافة منتج جديد</h2>

    <form id="productForm">
      <input type="hidden" id="productId">

      <label>اسم المنتج</label>
      <input id="name" required placeholder="مثلاً: تيشيرت رجالي">

      <label>الصنف</label>
      <select id="category" required>
        <option value="رجالي">رجالي</option>
        <option value="نسائي">نسائي</option>
        <option value="أطفال">أطفال</option>
        <option value="أقمشة">أقمشة</option>
      </select>

      <label>الثمن بالدرهم</label>
      <input id="price" type="number" min="0" required>

      <label>الحد الأدنى للطلب</label>
      <input id="min" type="number" min="1" required>

      <label>صورة المنتج</label>
      <input id="imageFile" type="file" accept="image/*">
      <img id="preview" alt="معاينة الصورة">

      <p class="note">
        اختر صورة من هاتفك. سيتم ضغطها تلقائياً قبل حفظها.
        الحد الأقصى للصورة بعد الضغط حوالي 600 كيلوبايت.
      </p>

      <button class="primary" type="submit" id="saveBtn">حفظ المنتج</button>
      <button class="secondary hidden" type="button" id="cancelBtn">إلغاء التعديل</button>
    </form>
    <div id="message"></div>
  </div>

  <div class="card">
    <h2>المنتجات الحالية</h2>
    <div id="productList">جاري تحميل المنتجات...</div>
  </div>

</section>
</main>

<script type="module">
import "./firebase.js";

const api = window.mozounaAdmin;
const ADMIN_UID = "4h8vDZ4RXbOgdxxbVC0W76GcIyD2";
const $ = id => document.getElementById(id);

let products = [];
let selectedImage = "";

function message(text, error=false) {
  $("message").textContent = text;
  $("message").style.color = error ? "#b52b2b" : "#168a58";
}

function showAdmin() {
  $("loginBox").classList.add("hidden");
  $("adminBox").classList.remove("hidden");
  loadProducts();
}

function showLogin() {
  $("adminBox").classList.add("hidden");
  $("loginBox").classList.remove("hidden");
}

async function loadProducts() {
  $("productList").textContent = "جاري التحميل...";
  try {
    products = await api.loadProducts();
    renderProducts();
  } catch(error) {
    $("productList").textContent = "تعذر تحميل المنتجات: " + error.message;
  }
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function renderProducts() {
  if (!products.length) {
    $("productList").textContent = "لا توجد منتجات محفوظة حالياً.";
    return;
  }

  $("productList").innerHTML = products.map(p => `
    <div class="product">
      <img src="${escapeHTML(p.image || "")}" alt="">
      <div class="product-info">
        <strong>${escapeHTML(p.name)}</strong>
        <small>${escapeHTML(p.category)} · ${p.price} درهم · الحد الأدنى ${p.min}</small>
        <div class="actions">
          <button class="gold" data-edit="${escapeHTML(p.id)}">تعديل</button>
          <button class="danger" data-delete="${escapeHTML(p.id)}">حذف</button>
        </div>
      </div>
    </div>
  `).join("");

  $("productList").querySelectorAll("[data-edit]").forEach(btn => {
    btn.onclick = () => editProduct(btn.dataset.edit);
  });

  $("productList").querySelectorAll("[data-delete]").forEach(btn => {
    btn.onclick = () => removeProduct(btn.dataset.delete);
  });
}

function resetForm() {
  $("productForm").reset();
  $("productId").value = "";
  $("formTitle").textContent = "إضافة منتج جديد";
  $("saveBtn").textContent = "حفظ المنتج";
  $("cancelBtn").classList.add("hidden");
  $("preview").style.display = "none";
  selectedImage = "";
  message("");
}

function editProduct(id) {
  const p = products.find(x => x.id === id);
  if (!p) return;

  $("productId").value = p.id;
  $("name").value = p.name || "";
  $("category").value = p.category || "رجالي";
  $("price").value = p.price || "";
  $("min").value = p.min || 1;

  selectedImage = p.image || "";
  if (selectedImage) {
    $("preview").src = selectedImage;
    $("preview").style.display = "block";
  }

  $("formTitle").textContent = "تعديل المنتج";
  $("saveBtn").textContent = "حفظ التعديلات";
  $("cancelBtn").classList.remove("hidden");
  window.scrollTo({top:0,behavior:"smooth"});
}

async function removeProduct(id) {
  if (!confirm("هل تريد حذف هذا المنتج؟")) return;

  try {
    await api.deleteProduct(id);
    await loadProducts();
    message("تم حذف المنتج.");
  } catch(error) {
    message(error.message, true);
  }
}

async function compressImage(file) {
  const img = new Image();
  const url = URL.createObjectURL(file);

  try {
    await new Promise((resolve,reject) => {
      img.onload = resolve;
      img.onerror = reject;
      img.src = url;
    });

    const canvas = document.createElement("canvas");
    const scale = Math.min(1, 900 / Math.max(img.width,img.height));
    canvas.width = Math.round(img.width * scale);
    canvas.height = Math.round(img.height * scale);

    const ctx = canvas.getContext("2d");
    ctx.drawImage(img,0,0,canvas.width,canvas.height);

    let quality = 0.65;
    let result = canvas.toDataURL("image/jpeg",quality);

    while (result.length > 600000 && quality > 0.25) {
      quality -= 0.1;
      result = canvas.toDataURL("image/jpeg",quality);
    }

    if (result.length > 600000) {
      throw new Error("الصورة كبيرة جداً. اختر صورة أصغر.");
    }

    return result;
  } finally {
    URL.revokeObjectURL(url);
  }
}

$("imageFile").addEventListener("change", async e => {
  const file = e.target.files[0];
  if (!file) return;

  try {
    selectedImage = await compressImage(file);
    $("preview").src = selectedImage;
    $("preview").style.display = "block";
    message("تم تجهيز الصورة.");
  } catch(error) {
    selectedImage = "";
    message(error.message, true);
  }
});

$("productForm").addEventListener("submit", async e => {
  e.preventDefault();

  if (api.getUser()?.uid !== ADMIN_UID) {
    message("يجب تسجيل الدخول بحساب الإدارة.", true);
    return;
  }

  if (!selectedImage) {
    message("اختر صورة للمنتج أولاً.", true);
    return;
  }

  const product = {
    id: $("productId").value || null,
    name: $("name").value.trim(),
    category: $("category").value,
    price: Number($("price").value),
    min: Number($("min").value),
    image: selectedImage
  };

  if (!product.name || product.price < 0 || product.min < 1) {
    message("تحقق من معلومات المنتج.", true);
    return;
  }

  $("saveBtn").disabled = true;
  $("saveBtn").textContent = "جاري الحفظ...";

  try {
    await api.saveProduct(product);
    resetForm();
    await loadProducts();
    message("تم حفظ المنتج بنجاح.");
  } catch(error) {
    message("خطأ أثناء الحفظ: " + error.message, true);
  } finally {
    $("saveBtn").disabled = false;
    $("saveBtn").textContent = $("productId").value
      ? "حفظ التعديلات" : "حفظ المنتج";
  }
});

$("loginBtn").onclick = async () => {
  $("loginMessage").textContent = "جاري تسجيل الدخول...";
  try {
    await api.login($("email").value.trim(), $("password").value);
    showAdmin();
    $("password").value = "";
  } catch(error) {
    $("loginMessage").textContent = "تعذر الدخول: " + error.message;
  }
};

$("logoutBtn").onclick = async () => {
  await api.logout();
  showLogin();
};

$("cancelBtn").onclick = resetForm;

if (api.getUser()?.uid === ADMIN_UID) showAdmin();

window.addEventListener("mozouna-auth", e => {
  if (e.detail.isAdmin) showAdmin();
  else showLogin();
});
</script>

</body>
</html>
